    <title>Trà Dược Việt Nam — Quản lý khách hàng</title>
    <script>
      (function() {
        var search = window.location.search || '';
        var apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:4520'
          : 'https://tracrm-api.bizino.ai';
        fetch(apiBase + '/api/v1/platform/branding' + search)
          .then(res => res.json())
          .then(data => {
            window.__BIZCRM_BRANDING__ = data;
            if (data.brandName) {
              document.title = data.brandName + (data.tagline ? ' — ' + data.tagline : ' — Quản lý khách hàng');
            }
            if (data.logoUrl) {
              var favicon = document.querySelector('link[rel="icon"]');
              if (favicon) favicon.href = data.logoUrl;
            }
            if (data.primaryColor) {
              document.documentElement.style.setProperty('--primary-color', data.primaryColor);
            }
          })
          .catch(function(e) { console.error('Branding load err:', e); });
      })();
    </script>
